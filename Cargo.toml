[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.19"
url = "2.5.8"
tokio = { version = "1.53.1", features = ["net", "time", "sync", "macros"] }
reqwest = { version = "0.13.4", features = ["json"] }
sha2 = "0.11.0"
base64 = "0.23.0"
rand = "0.10.2"
dirs = "6.0.0"
