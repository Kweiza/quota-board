[package]
name = "quota-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["os-keychain", "encrypted-file"]

# The OS keychain store (`secrets::keychain`).
#
# Off for a host that supplies its own `SecretStore` across an FFI boundary.
# That is not a preference on mobile: keyring registers no credential store on
# either iOS or Android, so `KeychainStore::probe` can only ever fail there, and
# on iOS the crate does not compile at all without an extra feature. A host that
# implements the four-method trait in Swift or Kotlin needs none of it — and it
# is the only way to reach `kSecAttrAccessGroup` and `kSecAttrAccessible`, which
# `keyring::Entry::new` cannot express.
os-keychain = ["dep:keyring", "dep:keyring-core"]

# The passphrase-derived encrypted-file store (`secrets::encrypted_file`).
#
# Off wherever there is nowhere to type a passphrase, and off wherever 64 MiB
# is not available. `KdfParams` uses Argon2id at `m_cost = 64 * 1024`, against
# an iOS widget-extension memory cap observed at roughly 30 MB that cannot be
# raised — so linking this into an extension is an unconditional jetsam rather
# than a slow path. Turning it off makes that exclusion a compile-time property
# a build can assert, instead of a rule someone has to remember.
encrypted-file = ["dep:argon2", "dep:chacha20poly1305"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
keyring = { version = "4.1.5", optional = true }
keyring-core = { version = "1.0.0", optional = true }
argon2 = { version = "0.5", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
rand.workspace = true
sha2.workspace = true
base64.workspace = true
url.workspace = true
reqwest.workspace = true
tokio.workspace = true
dirs.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
wiremock = "0.6.5"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
